baseURL = "https://tristan.dobrowney.com/"
locale = "en-CA"
title = "Tristan Dobrowney"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Tristan Dobrowney: systems engineer working on embedded Linux, firmware and the hardware underneath. Project write-ups and résumé."
  tagline = "Systems engineer: embedded Linux, firmware, and the hardware underneath."
  email = "tristan@dobrowney.com"
  github = "https://github.com/DobrowneyT"
  linkedin = "https://www.linkedin.com/in/tristan-dobrowney-68b3ba161"
  resumePDF = "/resume/Tristan-Dobrowney-Resume.pdf"

[menus]
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 10
  [[menus.main]]
    name = "Résumé"
    pageRef = "/resume"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  # Code highlighting uses CSS classes, not inline styles: the site's
  # Content-Security-Policy forbids inline styles. Colours are in main.css.
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  page = ["html"]

# locale and hugo.Data need >= 0.158; the VPS installs a pinned .deb (see README)
[module.hugoVersion]
  min = "0.158.0"
