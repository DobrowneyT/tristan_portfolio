profile: >-
  Systems and embedded engineer at PTx Trimble working across the full stack of an
  autonomous tractor platform, from harnessing and STM32 firmware through a custom
  embedded Linux kernel to ROS2 applications. Experienced in fleet provisioning and
  update infrastructure, CAN/ISOBUS and USB/Ethernet communication, and
  hardware-software integration, with a computer architecture and instruction-set
  design focus from university.

