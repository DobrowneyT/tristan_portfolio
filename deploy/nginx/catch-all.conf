# /etc/nginx/sites-available/catch-all  (enabled as sites-enabled/catch-all)
#
# Answers every request whose host name matches no site on this VPS: the bare
# IP, and any made-up name under the wildcard *.dobrowney.com DNS record.
# Without it nginx falls back to the first server it loaded on each port,
# which served the Torn Dashboard (dev.monchoon.me) to any unknown HTTPS name.
#
#   HTTP  -> nginx's plain "404 Not Found" page
#   HTTPS -> the TLS handshake is refused (no certificate covers unknown names,
#            so any page would only show a certificate warning anyway)
#
# It replaces Ubuntu's stock `default` site ("Welcome to nginx!"), which also
# claims `default_server` on port 80, so that one must be disabled:
#   sudo install -m 644 deploy/nginx/catch-all.conf /etc/nginx/sites-available/catch-all
#   sudo ln -s /etc/nginx/sites-available/catch-all /etc/nginx/sites-enabled/catch-all
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    return 404;
}
