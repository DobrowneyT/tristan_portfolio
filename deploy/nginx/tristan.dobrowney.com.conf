# /etc/nginx/sites-available/tristan.dobrowney.com
#
# Static site, served straight from the git clone that site-sync keeps up to
# date (deploy/site-sync/). Only public/ is the web root, so .git/, deploy/ and
# README.md are never reachable over HTTP.
#
# TLS: issue the certificate BEFORE enabling this file (nginx -t fails while the
# cert paths do not exist):
#   sudo certbot certonly --nginx --cert-name tristan.dobrowney.com -d tristan.dobrowney.com
# certbot renews it by itself. Do not run `certbot --nginx` (without certonly)
# against this site: it would rewrite this file.

server {
    listen 443 ssl;
    server_name tristan.dobrowney.com;

    ssl_certificate /etc/letsencrypt/live/tristan.dobrowney.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tristan.dobrowney.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    root /srv/sites/tristan_portfolio/public;
    index index.html;
    autoindex off;

    # dotfiles are never served
    location ~ /\. {
        deny all;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
        # file names are not content-hashed, so let browsers revalidate;
        # a push is live within ~5 minutes (site-sync timer)
        expires 5m;
    }
}

server {
    listen 80;
    server_name tristan.dobrowney.com;
    return 301 https://$host$request_uri;
}
