{{ define "main" }}
<div class="wrap">
  <section class="hero">
    <h1>{{ site.Title }}</h1>
    <p class="tagline">{{ site.Params.tagline }}</p>
    <div class="prose">{{ .Content }}</div>
  </section>

  <section aria-labelledby="projects-heading">
    <h2 id="projects-heading" class="section-title">Projects</h2>
    <div class="cards">
      {{- range (where site.RegularPages "Section" "projects").ByWeight }}
      {{ partial "project-card.html" . }}
      {{- end }}
    </div>
  </section>
</div>
{{ end }}
